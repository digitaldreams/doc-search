# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.embedding_model: '%env(EMBEDDING_MODEL)%'
    app.rerank_model: '%env(RERANK_MODEL)%'
    app.rerank_options: '%env(json:RERANK_OPTIONS)%'
    app.search_limit: '%env(int:SEARCH_LIMIT)%'
    app.embed_timeout: '%env(float:EMBED_TIMEOUT)%'
    app.docs_repo: '%env(DOCS_REPO)%'
    # The docs repos to search, keyed by GitHub name; the page offers each one, ingest takes the key:
    # `app:docs:ingest laravel/docs`. Shipped vectors: data/seed_vectors/<key>.bin, question sets: data/queries/<key>/.
    app.docs_repos:
        symfony/symfony-docs: &symfony
            label: Symfony
            path: '%kernel.project_dir%/data/docs'
            extension: rst
            url: 'https://symfony.com/doc/current/{page}.html' # {page}: the file's path without its extension
            exclude: ['#(^|/)_#'] # `_*` files and dirs are includes and build output
            examples:
                - send people somewhere else when they type a wrong password
                - stop validating a field after the first rule that fails
                - tell if code is running in a persistent process mode rather than per request
                - why does my post-login account check run on each API request
                - PhpArrayAdapter
                - move an old standard edition project to the new recipe tool
        # Another repo, e.g. after `git clone --depth 1 https://github.com/laravel/docs data/laravel-docs`:
        laravel/docs:
            label: Laravel
            path: '%kernel.project_dir%/data/laravel-docs'
            extension: md
            url: 'https://laravel.com/docs/13.x/{page}'
            exclude: [readme.md, license.md, documentation.md] # documentation.md is the site's menu
            examples:
                - run a closure on a different queue connection
        # Sparse clone of the doc/ folder: `git clone --depth 1 --filter=blob:none --sparse -b 3.x https://github.com/twigphp/Twig data/twig && git -C data/twig sparse-checkout set doc`
        twigphp/Twig:
            label: Twig
            path: '%kernel.project_dir%/data/twig/doc'
            extension: rst
            url: 'https://twig.symfony.com/doc/3.x/{page}.html'
            exclude: ['#(^|/)_#'] # _build is the site builder
            examples:
                - format a date in the user's language
                - loop over items and do something different for the last one
                - escape a variable for use inside a JavaScript string
        # Same, -b 3.7.x https://github.com/doctrine/orm data/doctrine-orm, sparse-checkout set docs
        doctrine/orm:
            label: Doctrine ORM
            path: '%kernel.project_dir%/data/doctrine-orm/docs/en'
            extension: rst
            url: 'https://www.doctrine-project.org/projects/doctrine-orm/en/3.7/{page}.html'
            exclude: [sidebar.rst] # the site's menu
            examples:
                - store a PHP enum in a column
                - keep a running total on the parent without loading every child
                - fetch big result sets without running out of memory
        # Same, -b 4.5.x https://github.com/doctrine/dbal data/doctrine-dbal, sparse-checkout set docs
        doctrine/dbal:
            label: Doctrine DBAL
            path: '%kernel.project_dir%/data/doctrine-dbal/docs/en'
            extension: rst
            url: 'https://www.doctrine-project.org/projects/doctrine-dbal/en/4.5/{page}.html'
            exclude: [sidebar.rst] # the site's menu
            examples:
                - retry a transaction after a deadlock
                - pass an array of ids to an IN clause
                - list the columns of a table

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # A model host that is off fails in 1 s. One that connects and then stalls is cut off after app.embed_timeout
    # on the calls that answer in milliseconds (embeddings, Ollama's model lookup), so a stuck host cannot hold every
    # web worker; the rerank keeps framework_http.yaml's 300 s, because on CPU it sends nothing for about a minute.
    app.ai_http_client:
        class: Symfony\Component\HttpClient\ScopingHttpClient
        arguments:
            - '@http_client'
            - '.*(/api/embed|/api/show|:batchEmbedContents)$': { timeout: '%app.embed_timeout%', max_connect_duration: 1 }
              '.*': { max_connect_duration: 1 }

    # The docs store: pgvector (ai.yaml) for meaning, BM25 for exact words. CombinedStore writes both and fuses a
    # HybridQuery by reciprocal rank. The StoreInterface alias stays the plain Postgres store, so app:docs:eval's
    # store-* modes keep measuring Symfony AI's own text and hybrid queries.
    app.docs_store:
        class: Symfony\AI\Store\CombinedStore
        arguments: ['@ai.store.postgres.docs', '@App\Docs\Bm25Store']

    App\Docs\ChunkIndex:
        arguments: { $store: '@app.docs_store' }

    App\Docs\Retriever:
        arguments: { $store: '@app.docs_store' }

    App\Docs\Embedder:
        arguments:
            $vectorizer: '@ai.vectorizer.docs'
            $model: '%app.embedding_model%'

    App\Docs\Repos:
        arguments:
            $repos: '%app.docs_repos%'
            $default: '%app.docs_repo%'

    App\Docs\Reranker:
        arguments:
            $model: '%app.rerank_model%'
            $options: '%app.rerank_options%'

when@test:
    parameters:
        app.embed_timeout: 1
        app.docs_repos:
            symfony/symfony-docs: *symfony
            laravel/docs: { label: Laravel, path: '%kernel.project_dir%/tests/fixtures', extension: md, url: 'https://laravel.com/docs/13.x/{page}' }

    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\Tests\Docs\FakeEmbeddings:
            factory: ['App\Tests\Docs\FakeEmbeddings', 'platform']

        # the real Embedder wiring, with the model swapped for a deterministic fake
        ai.vectorizer.docs:
            class: Symfony\AI\Store\Document\Vectorizer
            arguments: ['@App\Tests\Docs\FakeEmbeddings', 'test-model']
